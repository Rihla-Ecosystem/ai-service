[project]
name = "rihla-ai-service"
version = "0.1.0"
description = "AI service for Rihla platform — LLM, RAG, agents, multimodal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "structlog>=24.0.0",
    "google-genai>=1.0.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "qdrant-client[fastembed]>=1.12.0",
    "langfuse>=2.55.0",
    "openinference-instrumentation-google-genai>=1.0.0",
    "prometheus-client>=0.20.0",
    "slowapi>=0.1.9",
    "pillow>=10.0.0",
    "av==15.1.0",
    "imagehash>=4.3.0",
    "gtts>=2.5.0",
    "pyyaml>=6.0.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]
