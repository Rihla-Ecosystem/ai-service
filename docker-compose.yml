services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    environment:
      QDRANT_ALLOW_RECOVERY: "true"

    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-service

    ports:
      - "3003:3003"

    env_file:
      - .env

    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

      GIS_SERVICE_URL: http://geocontext:8000
      RISK_SERVICE_URL: http://risk-intelligence:3001
      CORE_SERVER_URL: http://core-server:3000

    volumes:
      - ./data:/app/data
      - ../../RAG:/app/data/rag:ro

    depends_on:
      - qdrant

    restart: unless-stopped

volumes:
  qdrant_data: