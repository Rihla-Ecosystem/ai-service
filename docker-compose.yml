version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_ALLOW_RECOVERY=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-service:
    build: .
    ports:
      - "3003:3003"
    volumes:
      - ./data:/app/data
      - ../../RAG:/app/data/rag:ro
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GIS_SERVICE_URL=http://geocontext:8000
      - RISK_SERVICE_URL=http://risk-intelligence:3001
      - CORE_SERVER_URL=http://core-server:3000
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data:
